{% extends "base.html" %}

{% block stylename %}catalog{% endblock %}

{% block main %}
    <div class="product">
        <div class="product__grid">
            {% for prod in products %}
            <div class="product__preview">
                <img src="{{prod.image}}" alt="" class="product__preview-image">

                <div class="product__preview-firstline">
                    <img src="/static/img/header/favourite.svg" alt="" class="firstline__icon">
                    <img src="/static/img/header/cart1.svg" alt="" class="firstline__icon">
                </div>

                <div class="product__preview-priceline">
                    <div class="priceline__optom">
                        <p>Оптовая цена</p>
                        <span>{{ prod.good_price }}₽</span>
                    </div>
                    <div class="priceline__default">
                        <p>Цена без скидки</p>
                        <span>{{ prod.bad_price }}₽</span>
                    </div>
                </div>

                <p class="product__preview-title">{{prod.name}}</p>
            </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
